<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Flores Timur (GeoServer + LeafletJS)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Styling Kotak Legenda Custom */
        .info.legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            line-height: 18px;
            color: #333;
            max-height: 80vh;
            overflow-y: auto;
        }

        .info.legend h4 {
            margin: 0 0 8px;
            color: #111;
            font-size: 14px;
        }

        .legend-item {
            margin-bottom: 8px;
        }

        .legend-item b {
            font-size: 13px;
        }

        .legend-item img {
            display: block;
            margin-top: 3px;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inisialisasi Peta (Pusat di Flores Timur)
        var map = L.map("map").setView([-8.32, 122.98], 10);

        // 2. Basemap OpenStreetMap
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Layer WMS GeoServer
        var wmsBatasKecamatan = L.tileLayer.wms("http://localhost:8080/geoserver/pg_web/wms", {
            layers: "pg_web:batas_kecamatan",
            format: "image/png",
            transparent: true,
            version: "1.1.0"
        }).addTo(map);

        var wmsJalan = L.tileLayer.wms("http://localhost:8080/geoserver/pg_web/wms", {
            layers: "pg_web:jalan",
            format: "image/png",
            transparent: true,
            version: "1.1.0"
        }).addTo(map);

        var wmsSungai = L.tileLayer.wms("http://localhost:8080/geoserver/pg_web/wms", {
            layers: "pg_web:sungai",
            format: "image/png",
            transparent: true,
            version: "1.1.0"
        }).addTo(map);

        // 4. Skala Peta
        L.control.scale({
            position: 'bottomleft',
            metric: true,
            imperial: false
        }).addTo(map);

        // 5. Menambahkan Legenda Peta Dinamis (Tanpa Titik Dua)
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = '<h4>Legenda Peta</h4>';

            var urlKecamatan = "http://localhost:8080/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pg_web:batas_kecamatan";
            var urlJalan = "http://localhost:8080/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pg_web:jalan";
            var urlSungai = "http://localhost:8080/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pg_web:sungai";

            // Mengelompokkan item legenda dengan ID sesuai masing-masing layer
            div.innerHTML += '<div class="legend-item" id="legend-kecamatan"><b>Batas Kecamatan</b><br><img src="' + urlKecamatan + '"></div>';
            div.innerHTML += '<div class="legend-item" id="legend-jalan"><b>Jaringan Jalan</b><br><img src="' + urlJalan + '"></div>';
            div.innerHTML += '<div class="legend-item" id="legend-sungai"><b>Jaringan Sungai</b><br><img src="' + urlSungai + '"></div>';

            return div;
        };

        legend.addTo(map);

        // 6. Layer Control (Switcher)
        var baseMaps = {
            "OpenStreetMap": osm
        };

        var overlayMaps = {
            "Batas Kecamatan": wmsBatasKecamatan,
            "Jaringan Jalan": wmsJalan,
            "Jaringan Sungai": wmsSungai
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);

        // 7. Event Handler untuk Sinkronisasi Centang Layer dengan Legenda
        map.on('overlayadd', function (eventLayer) {
            if (eventLayer.name === "Batas Kecamatan") {
                document.getElementById("legend-kecamatan").style.display = "block";
            } else if (eventLayer.name === "Jaringan Jalan") {
                document.getElementById("legend-jalan").style.display = "block";
            } else if (eventLayer.name === "Jaringan Sungai") {
                document.getElementById("legend-sungai").style.display = "block";
            }
        });

        map.on('overlayremove', function (eventLayer) {
            if (eventLayer.name === "Batas Kecamatan") {
                document.getElementById("legend-kecamatan").style.display = "none";
            } else if (eventLayer.name === "Jaringan Jalan") {
                document.getElementById("legend-jalan").style.display = "none";
            } else if (eventLayer.name === "Jaringan Sungai") {
                document.getElementById("legend-sungai").style.display = "none";
            }
        });
    </script>
</body>

</html>
